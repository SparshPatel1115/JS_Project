<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <style>
        body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(to right, #c869df, #7c5d82);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: rgb(8, 6, 9);
    border-radius: 15px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    padding: 40px;
    width: 80%;
    max-width: 400px;
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .container {
        width: 90%;
    }
}

h2 {
    font-size: 24px;
    color: #a5a0a0;
    margin-bottom: 20px;
    font-weight: bold;
}

.checkboxes {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    margin-bottom: 20px;
    padding: 0 15px;
}

.checkboxes label {
    font-size: 14px;
    color: #a49d9d;
    margin-bottom: 10px;
}

.checkboxes input {
    margin-right: 8px;
    transform: scale(1.2);
}

.slider-container {
    margin: 20px 0;
}

.slider-container label {
    display: block;
    font-size: 14px;
    color: #555;
    margin-bottom: 5px;
}

input[type="range"] {
    width: 100%;
}

button {
    background-color: #4CAF50;
    color: white;
    padding: 15px 25px;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.3s ease;
}

button:hover {
    background-color: #45a049;
    transform: translateY(-2px);
}

.password-container {
    margin-top: 25px;
}

input[type="text"] {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid #ddd;
    margin-bottom: 15px;
    background-color: #f8f8f8;
    color: #333;
    box-sizing: border-box;
}

.copy-button {
    margin-top: 10px;
    background-color: #007BFF;
    border: none;
    padding: 12px 20px;
    border-radius: 50px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 4px 8px rgba(0, 123, 255, 0.3);
}

.copy-button:hover {
    background-color: #0056b3;
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0, 123, 255, 0.4);
}

#message {
    font-size: 14px;
    color: #e74c3c;
    margin-top: 15px;
}
    </style>
</head>
<body>
    <div class="container">
        <h2>Random Password Generator</h2>
        <div class="checkboxes">
            <label><input type="checkbox" id="uppercase"> Uppercase</label>
            <label><input type="checkbox" id="lowercase"> Lowercase</label>
            <label><input type="checkbox" id="digits"> Digits</label>
            <label><input type="checkbox" id="special"> Special Characters</label>
        </div>
        <div class="slider-container">
            <label for="password-length">Password Length: <span id="length-value">12</span></label>
            <input type="range" id="password-length" min="15" max="50" value="12" oninput="updateLengthValue()">
        </div>
        <button onclick="generatePassword()">Generate</button>
        <div class="password-container">
            <input type="text" id="password" readonly>
            <button class="copy-button" onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>
        <p id="message"></p>
    </div>

    <script>
        function updateLengthValue() 
        {
            const length = document.getElementById("password-length").value
            document.getElementById("length-value").innerText = length
        }

        function generatePassword() 
        {
            const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
            const lower = "abcdefghijklmnopqrstuvwxyz"
            const digits = "0123456789"
            const special = "!@#$%^&*()_+-=[]{}|;:,.<>?"
            let characters = ""
            let password = ""

            if (document.getElementById("uppercase").checked) characters += upper
            if (document.getElementById("lowercase").checked) characters += lower
            if (document.getElementById("digits").checked) characters += digits
            if (document.getElementById("special").checked) characters += special

            if (characters === "") 
            {
                document.getElementById("message").innerText = "Please select at least one option."
                return
            } 
            else 
            {
                document.getElementById("message").innerText = ""
            }

            const length = document.getElementById("password-length").value

            for (let i = 0; i < length; i++) 
            {
                const randomIndex = Math.floor(Math.random() * characters.length)
                password += characters[randomIndex]
            }

            document.getElementById("password").value = password
        }

        function copyToClipboard() 
        {
            const passwordField = document.getElementById("password")
            passwordField.select()
            passwordField.setSelectionRange(0, 99999)
            navigator.clipboard.writeText(passwordField.value).then(() => 
            {
                alert("Password copied to clipboard!")
            })
        }
    </script>
</body>
</html>
